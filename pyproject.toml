[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-regression"
version = "0.1.0"
description = "Evidence-based LLM application security regression with mcp-agent and MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp-agent[openai]==0.2.6", "mcp>=1.20,<2", "openai>=1.58,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx==0.28.1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
guardbench = "guardbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardbench = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

